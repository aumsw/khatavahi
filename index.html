<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cyan Navy App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: phone-width app shell. Top app bar, scrolling content, bottom tab bar. Cyan accent on navy. Every label is English plus Gujarati. */
:root{
  --bg:#EDF4F8; --surface:#FFFFFF; --fg:#0B2545; --muted:#5A6B80; --line:#D9E5EE;
  --accent:#0A8FAE; --accent-fill:#06B6D4; --on-accent:#032530; --soft:#E0F6FB;
  --bar:#0B2545; --on-bar:#FFFFFF; --danger:#C2410C;
  --font:'Inter','Noto Sans Gujarati',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --head:'Space Grotesk','Inter','Noto Sans Gujarati',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06122A; --surface:#0D2144; --fg:#E6F1F8; --muted:#8FA6BF; --line:#1B3560;
  --accent:#22D3EE; --accent-fill:#22D3EE; --on-accent:#03222B; --soft:#0F2C4E;
  --bar:#0A1A38; --on-bar:#FFFFFF; --danger:#FB923C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06122A; --surface:#0D2144; --fg:#E6F1F8; --muted:#8FA6BF; --line:#1B3560;
  --accent:#22D3EE; --accent-fill:#22D3EE; --on-accent:#03222B; --soft:#0F2C4E;
  --bar:#0A1A38; --on-bar:#FFFFFF; --danger:#FB923C; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
body::after{content:"";position:fixed;inset:auto 0 0;height:env(safe-area-inset-bottom,0px);background:var(--surface);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent-fill);outline-offset:2px}

.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.gut{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}

.bar{background:var(--bar);color:var(--on-bar);flex:none}
.bar-in{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent-fill);color:var(--on-accent);display:grid;place-items:center;font:700 14px var(--head);flex:none}
.ttl{font:700 19px var(--head);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .gu{font:600 15px var(--font);opacity:.8;margin-left:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--on-bar);transition:background .15s;flex:none}
.icon-btn:active{background:rgba(255,255,255,.18)}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}

main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
main>.gut{flex:1;display:flex;flex-direction:column;padding-block:16px 20px}
.view{flex:1;display:flex;flex-direction:column;gap:14px}
.view[hidden],[hidden]{display:none!important}

.uc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:32px 8px}
.uc .ring{width:84px;height:84px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin-bottom:10px}
.uc .ring svg{width:40px;height:40px}
.uc b{font:700 22px var(--head)}
.uc .gb{font:700 18px var(--font);color:var(--accent);margin-bottom:6px}
.uc span{color:var(--muted);max-width:28ch;line-height:1.5}

h2{font:700 13px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 0}
h2 .gu{text-transform:none;letter-spacing:0;margin-left:6px}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.opt{width:100%;display:flex;align-items:center;gap:14px;padding:14px;text-align:left;border-top:1px solid var(--line);transition:background .15s}
.opt:first-child{border-top:0}
.opt:active{background:var(--soft)}
.opt .dot{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--accent)}
.opt .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.opt .t b{font-weight:600;font-size:15px}
.opt .t .gu{font-weight:600;font-size:14px;color:var(--accent)}
.opt .t small{color:var(--muted);font-size:12px;margin-top:2px}
.opt .chev{color:var(--muted);width:22px;height:22px}

/* Add / Edit / Delete Items */
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;padding:4px 10px 4px 0;min-height:36px}
.back svg{width:20px;height:20px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mode{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:96px;padding:10px 6px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--accent);font-weight:600;text-align:center;line-height:1.25;transition:transform .1s}
.mode:active{transform:scale(.97)}
.mode svg{width:26px;height:26px;margin-bottom:4px}
.mode .gu{font-size:13px;font-weight:600;opacity:.9}
.mode[aria-pressed="true"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card h3{margin:0;font:700 20px var(--head);color:var(--accent)}
textarea{padding:12px 14px;min-height:84px;resize:vertical;line-height:1.4}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld label{font-weight:600;font-size:15px}
.fld .sub{font-size:12px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=tel],input[type=email],textarea,select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent-fill);outline:0;box-shadow:0 0 0 3px var(--soft)}
.guRow{display:flex;gap:8px}
.kbBtn{width:52px;flex:none;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;border:1.5px solid transparent}
.kbBtn[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-accent)}
.sugs{display:flex;flex-wrap:wrap;gap:8px}
.sugTitle{width:100%;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.sug{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:52px;padding:6px 14px;border-radius:14px;background:var(--soft);color:var(--accent);border:1.5px solid transparent;text-align:left;max-width:100%}
.sug .g{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.sug small{font-size:11px;color:var(--muted);font-weight:600}
.sug.on{border-color:var(--accent-fill)}
.micBtn[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-accent);animation:pulse 1.2s infinite}
.micBtn:disabled{opacity:.4}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(6,182,212,.55)}100%{box-shadow:0 0 0 14px rgba(6,182,212,0)}}
.micNote{font-size:12px;line-height:1.5;color:var(--accent);margin-top:-4px}
.micNote[data-kind="warn"]{color:var(--danger)}
.linkbtn{display:inline;margin-left:6px;font-weight:700;text-decoration:underline;color:inherit}
.autoNote{font-size:12px;color:var(--accent);line-height:1.5;margin-top:-6px}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.kb{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px;display:flex;flex-direction:column;gap:6px}
.kb .rowk{display:flex;flex-wrap:wrap;gap:5px}
.kb button{min-width:36px;height:38px;padding:0 6px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:16px;font-weight:500}
.kb button:active{background:var(--soft)}
.kb .wide{flex:1;min-width:80px;font-size:13px;color:var(--muted)}
.kb .lab{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.btn{min-height:54px;border-radius:14px;padding:6px 12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn .gu{font-size:13px;font-weight:600;opacity:.85}
.btn.pri{background:var(--accent-fill);color:var(--on-accent)}
.btn.sec{background:var(--soft);color:var(--accent)}
.btn.dng{background:var(--danger);color:#fff}
.prompt{background:var(--soft);color:var(--fg);border-radius:12px;padding:14px;line-height:1.5}
.prompt .gu{display:block;color:var(--accent);font-weight:600}
.confirm{border:1.5px solid var(--danger);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.confirm b{font-size:15px}
.tbl{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.th,.tr{display:grid;grid-template-columns:1fr 104px;gap:10px;align-items:center;padding:12px 16px;text-align:left;width:100%}
.th{background:var(--bar);color:#fff;font-weight:700;font-size:15px}
.th small{display:block;font-weight:500;opacity:.8;font-size:12px}
.tr{border-top:1px solid var(--line);min-height:56px}
.tr:first-child{border-top:0}
.tr .n b{display:block;font-weight:600}
.tr .n span{color:var(--accent);font-weight:600;font-size:13px}
.tr .u{font-weight:600;font-size:13px}
.tr .u span{display:block;color:var(--muted);font-weight:500}
button.tr:active,.tr.sel{background:var(--soft)}
.tr .trash{color:var(--danger);width:20px;height:20px;margin-left:6px;vertical-align:middle}
.emptyRow{padding:22px 16px;text-align:center;color:var(--muted);line-height:1.6}

.pr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr .n{min-width:0}
.pr .n b{display:block;font-weight:600;overflow-wrap:anywhere}
.pr .n .g{display:block;color:var(--accent);font-weight:600;font-size:13px}
.pr .n .u{display:inline-block;margin-top:5px;background:var(--soft);color:var(--accent);font-weight:700;font-size:12px;padding:2px 9px;border-radius:10px}
.rb{display:flex;align-items:center;gap:6px}
.rs{font-weight:700;color:var(--muted)}
input.rate{width:92px;min-height:44px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;padding:0 10px}
input.rate[readonly]{background:var(--soft);border-color:transparent}
.ed{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--soft);flex:none}
.ed.on{background:var(--accent-fill);color:var(--on-accent)}
.ed svg{width:20px;height:20px}
.cmp{gap:10px}
.cmp .back{min-height:28px;padding:0}
.cmp .modes{gap:8px}
.cmp .mode{min-height:60px;padding:6px 4px;font-size:13px;border-width:1.5px;border-radius:14px}
.cmp .mode svg{width:22px;height:22px;margin-bottom:2px}
.cmp .mode .gu{font-size:11px}
.cmp .card{padding:12px;gap:10px}
.cmp .fld label{font-size:13px}
.cmp .fld label .gu{font-weight:500;color:var(--muted);margin-left:4px;font-size:11px}
.cmp input[type=text],.cmp input[type=tel],.cmp input[type=email]{min-height:42px}
.cmp textarea{min-height:56px;padding:8px 14px}
.cmp .btn{flex-direction:row;gap:8px;min-height:44px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav{flex:none;background:var(--surface);border-top:1px solid var(--line)}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);height:76px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);min-width:0;line-height:1.2}
.tab .pill-bg{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s;margin-bottom:2px}
.tab .en{font-size:11px;font-weight:600}
.tab .gu{font-size:11px;font-weight:500}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"] .pill-bg{background:var(--accent-fill);color:var(--on-accent)}
.tab:active .pill-bg{background:var(--soft)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--bar);color:#fff;padding:10px 16px;border-radius:22px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="bar"><div class="bar-in gut">
    <div class="brand"><div class="logo">GM</div><div class="ttl" id="ttl"></div></div>
    <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme / લાઇટ કે ડાર્ક થીમ બદલો"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zm0 16V5a7 7 0 010 14z"/></svg></button>
  </div></header>

  <main id="main"><div class="gut">

    <section class="view" id="v-home"></section>
    <section class="view" id="v-payment" hidden></section>
    <section class="view" id="v-bill" hidden></section>
    <section class="view" id="v-reports" hidden></section>

    <section class="view" id="v-admin" hidden>
      <h2>Add new<span class="gu">નવું ઉમેરો</span></h2>
      <div class="menu">
        <button class="opt" data-open="items">
          <span class="dot"><svg class="i" viewBox="0 0 24 24"><path d="M20 6h-3V4a2 2 0 00-2-2H9a2 2 0 00-2 2v2H4a2 2 0 00-2 2v11a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2zM9 4h6v2H9V4zm7 9h-3v3h-2v-3H8v-2h3V8h2v3h3v2z"/></svg></span>
          <span class="t"><b>Add Items</b><span class="gu">આઇટમ ઉમેરો</span><small>Create a new item · નવી આઇટમ બનાવો</small></span>
          <svg class="i chev" viewBox="0 0 24 24"><path d="M9.4 6 8 7.4l4.6 4.6L8 16.6 9.4 18l6-6z"/></svg>
        </button>
        <button class="opt" data-open="customer">
          <span class="dot"><svg class="i" viewBox="0 0 24 24"><path d="M15 12a4 4 0 100-8 4 4 0 000 8zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
          <span class="t"><b>Customer</b><span class="gu">ગ્રાહક</span><small>Add, edit or delete customers · ગ્રાહક ઉમેરો, સુધારો, કાઢો</small></span>
          <svg class="i chev" viewBox="0 0 24 24"><path d="M9.4 6 8 7.4l4.6 4.6L8 16.6 9.4 18l6-6z"/></svg>
        </button>
        <button class="opt" data-open="supplier">
          <span class="dot"><svg class="i" viewBox="0 0 24 24"><path d="M20 8h-3V4H3a2 2 0 00-2 2v11h2a3 3 0 006 0h6a3 3 0 006 0h2v-5l-3-4zM6 18.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm13.5-9 1.96 2.5H17V9.5h2.5zM18 18.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/></svg></span>
          <span class="t"><b>Supplier</b><span class="gu">સપ્લાયર</span><small>Add, edit or delete suppliers · સપ્લાયર ઉમેરો, સુધારો, કાઢો</small></span>
          <svg class="i chev" viewBox="0 0 24 24"><path d="M9.4 6 8 7.4l4.6 4.6L8 16.6 9.4 18l6-6z"/></svg>
        </button>
      </div>
      <h2>Rates<span class="gu">ભાવ</span></h2>
      <div class="menu">
        <button class="opt" data-open="prices">
          <span class="dot"><svg class="i" viewBox="0 0 24 24"><path d="M13.66 7a4 4 0 00-3.43-2H18V3H6v2h3.17a2.5 2.5 0 012.33 1.5H6v2h5.83c-.42 1.24-1.6 2-2.83 2H6v2h2.5L15 21h2.5l-6.7-8.2c2.25-.2 4-1.6 4.5-3.8H18V7h-4.34z"/></svg></span>
          <span class="t"><b>Price List</b><span class="gu">ભાવ પત્રક</span><small>Set the rate of each item · દરેક વસ્તુનો ભાવ નક્કી કરો</small></span>
          <svg class="i chev" viewBox="0 0 24 24"><path d="M9.4 6 8 7.4l4.6 4.6L8 16.6 9.4 18l6-6z"/></svg>
        </button>
      </div>
    </section>

    <section class="view" id="v-items" hidden>
      <button class="back" id="itemsBack"><svg class="i" viewBox="0 0 24 24"><path d="M15.4 6 16.8 7.4 12.2 12l4.6 4.6-1.4 1.4-6-6z"/></svg>Admin · એડમિન</button>

      <div class="modes" id="modes">
        <button class="mode" data-mode="add" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>Add Item<span class="gu">વસ્તુ ઉમેરો</span></button>
        <button class="mode" data-mode="edit" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>Edit Item<span class="gu">વસ્તુ સુધારો</span></button>
        <button class="mode" data-mode="delete" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>Delete Item<span class="gu">વસ્તુ કાઢો</span></button>
      </div>

      <div class="card">
        <h3 id="formTitle">Add Item / વસ્તુ ઉમેરો</h3>
        <div class="prompt" id="prompt" hidden></div>

        <form id="itemForm" class="card" style="border:0;padding:0;border-radius:0;background:none" autocomplete="off">
          <div class="fld">
            <label for="item-en">Item name (English)</label>
            <div class="sub">વસ્તુનું નામ (અંગ્રેજી)</div>
            <input type="text" id="item-en" autocapitalize="words" enterkeyhint="next">
          </div>
                    <div class="fld">
            <label for="item-unit">Unit</label>
            <div class="sub">એકમ</div>
            <select id="item-unit"></select>
          </div>
          <div class="actions">
            <button type="submit" class="btn pri">Save<span class="gu">સાચવો</span></button>
            <button type="button" class="btn sec" id="cancelBtn">Cancel<span class="gu">રદ કરો</span></button>
          </div>
        </form>

        <div class="confirm" id="confirm" hidden>
          <b id="confirmTxt"></b>
          <div class="actions">
            <button type="button" class="btn dng" id="confirmYes">Delete<span class="gu">કાઢો</span></button>
            <button type="button" class="btn sec" id="confirmNo">Cancel<span class="gu">રદ કરો</span></button>
          </div>
        </div>
      </div>

      <div class="tbl">
        <div class="th"><div>Item<small>વસ્તુ</small></div><div>Unit<small>એકમ</small></div></div>
        <div id="itemRows"></div>
      </div>

  var voice={kind:null,dict:null,SR:null,rec:null,cur:null,base:'',on:false,gone:{},failAt:0};
  function vField(t){return $(t==='en'?'#item-en':'#item-gu')}
  function showMics(){$$('.micBtn').forEach(function(b){b.hidden=!voice.kind||!!voice.gone[b.dataset.mic]})}
  function setNote(html,kind){var n=$('#micNote');if(!html){n.hidden=true;n.innerHTML='';n.dataset.kind='';return}n.hidden=false;n.dataset.kind=kind||'';n.innerHTML=html}
  function setOn(on){
    voice.on=on;
    $$('.micBtn').forEach(function(b){var me=on&&voice.cur===b.dataset.mic;b.setAttribute('aria-pressed',me?'true':'false');b.disabled=on&&!me});
    if(on)setNote('Listening… speak now · સાંભળી રહ્યું છે… બોલો','live');
    else if($('#micNote').dataset.kind==='live')setNote('');
  }
  function joinText(base,add){
    if(!add)return base;
    if(!base)return add.replace(/^\s+/,'');
    return (/\s$/.test(base)||/^\s/.test(add))?base+add:base+' '+add;
  }
  function vClean(t,x){
    x=x.replace(/[.,!?;:।]+/g,'').replace(/\s{2,}/g,' ');
    if(t==='en')x=x.replace(/\b[a-z]/g,function(c){return c.toUpperCase()});
    return x;
  }
  function afterVoice(t){if(t==='en')onEnglish();else{guTouched=true;updateSugs()}}
  function applyVoice(t,partial,final){
    var f=vField(t);if(!f)return;
    if(final)voice.base=joinText(voice.base,vClean(t,final));
    f.value=partial?joinText(voice.base,vClean(t,partial)):voice.base;
    afterVoice(t);
  }
  function openPerms(){
    var u=(window.claude&&claude.use)?claude.use('permissions'):Promise.resolve(null);
    u.then(function(p){if(p&&p.manage)return p.manage();toast('Open this page’s Permissions menu · પેજનું Permissions મેનુ ખોલો')})
     .catch(function(){toast('Open this page’s Permissions menu · પેજનું Permissions મેનુ ખોલો')});
  }
  function voiceFail(code){
    var now=Date.now();if(now-voice.failAt<800)return;voice.failAt=now;
    if(code==='not_granted'){
      setNote('Microphone permission was denied, so voice typing is off. Allow the microphone to use it. · માઇક્રોફોનની પરવાનગી નકારાઈ છે. વૉઇસ ટાઇપિંગ માટે માઇક્રોફોનની પરવાનગી આપો.'+
        (voice.kind==='cap'?'<button type="button" class="linkbtn" data-act="perm">Permissions · પરવાનગી</button>':''),'warn');
    }else if(code==='unavailable'){
      if(voice.cur)voice.gone[voice.cur]=true;showMics();
      toast('Voice typing is not available here · અહીં વૉઇસ ટાઇપિંગ ઉપલબ્ધ નથી');
    }else if(code==='rate_limited')toast('Too many requests. Try again shortly. · થોડીવાર પછી ફરી પ્રયત્ન કરો');
    else if(code==='upstream_error')toast('Voice typing failed. Try again. · વૉઇસ ટાઇપિંગ ચાલ્યું નહીં. ફરી પ્રયત્ન કરો');
  }
  function stopVoice(){
    try{
      if(voice.kind==='cap'&&voice.dict)voice.dict.stop().catch(function(){});
      else if(voice.rec)voice.rec.stop();
    }catch(e){}
  }
  function micClick(t){
    if(!voice.kind)return;
    if(voice.on)return stopVoice();
    voice.cur=t;voice.base=vField(t).value.replace(/\s+$/,'');
    setNote('');setOn(true);
    if(voice.kind==='cap'){
      voice.dict.start({language:t==='en'?'en':'gu'}).catch(function(err){
        var code=err&&err.code;
        if(code&&code!=='dismissed'&&code!=='stopped')voiceFail(code);
        setOn(false);voice.cur=null;
      });
      return;
    }
    var rec=new voice.SR();voice.rec=rec;
    rec.lang=t==='en'?'en-IN':'gu-IN';rec.interimResults=true;rec.continuous=false;
    rec.onresult=function(ev){
      var fin='',tmp='';
      for(var i=0;i<ev.results.length;i++){var r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else tmp+=r[0].transcript}
      var f=vField(t);f.value=joinText(voice.base,vClean(t,(fin+' '+tmp).trim()));afterVoice(t);
    };
    rec.onerror=function(ev){
      var c=ev&&ev.error;
      if(c==='not-allowed'||c==='service-not-allowed')voiceFail('not_granted');
      else if(c==='language-not-supported')voiceFail('unavailable');
      else if(c==='no-speech')toast('No speech heard · કંઈ સંભળાયું નહીં');
      else if(c!=='aborted')voiceFail('upstream_error');
    };
    rec.onend=function(){setOn(false);voice.cur=null};
    try{rec.start()}catch(e){setOn(false);voice.cur=null}
  }
  (function initVoice(){
    var p=(window.claude&&claude.use)?claude.use('dictation'):Promise.resolve(null);
    p.catch(function(){return null}).then(function(d){
      if(d){
        voice.kind='cap';voice.dict=d;
        d.onPartial(function(e){if(voice.cur)applyVoice(voice.cur,e.text||'','')});
        d.onFinal(function(e){if(voice.cur)applyVoice(voice.cur,'',e.text||'')});
        d.onState(function(e){
          if(e.state==='idle'){
            setOn(false);
            if(e.reason&&e.reason!=='stopped'&&e.reason!=='viewer_stopped'&&e.reason!=='hidden'&&e.reason!=='time_limit'&&e.reason!=='dismissed')voiceFail(e.reason);
            voice.cur=null;
          }else if(voice.cur)setOn(true);
        });
      }else{
        var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        if(SR){voice.kind='sr';voice.SR=SR}
      }
      showMics();
    });
  })();

  /* ---------- Price List ---------- */
  var PENCIL='<svg class="i" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
  var CHECK='<svg class="i" viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
  function fmtRate(n){n=+n||0;return n%1===0?String(n):n.toFixed(2)}
  function renderPrices(){
    var rows=items.map(function(x){
      var on=priceEdit===x.id;
      return '<div class="pr"><div class="n"><b>'+esc(x.en)+'</b><span class="u">1 '+esc(unitShort(x.unit))+' · '+esc(unitGu(x.unit))+'</span></div>'+
        '<div class="rb"><span class="rs">₹</span><input class="rate" type="text" inputmode="decimal" id="rate-'+x.id+'" data-rate="'+x.id+'" value="'+esc(fmtRate(prices[x.id]))+'"'+(on?'':' readonly')+' aria-label="Rate / ભાવ">'+
        '<button type="button" class="ed'+(on?' on':'')+'" data-edit="'+x.id+'" aria-label="'+(on?'Save rate / ભાવ સાચવો':'Edit rate / ભાવ બદલો')+'">'+(on?CHECK:PENCIL)+'</button></div></div>';
    }).join('');
    $('#priceRows').innerHTML=rows||'<div class="emptyRow">No items yet. Add items first.<br>હજી કોઈ વસ્તુ નથી. પહેલા વસ્તુ ઉમેરો.<br><button type="button" class="btn pri" data-open="items" style="margin:12px auto 0;min-width:200px">Add Items<span class="gu">આઇટમ ઉમેરો</span></button></div>';
  }
  function savePrice(id){
    var inp=$('#rate-'+id);if(!inp)return;
    var v=parseFloat(String(inp.value).replace(/,/g,'.').replace(/[^0-9.]/g,''));
    if(isNaN(v)||v<0){toast('Enter a valid rate · સાચો ભાવ લખો');return}
    prices[id]=Math.round(v*100)/100;save(PRICES_KEY,prices);priceEdit=null;renderPrices();toast('Rate saved · ભાવ સાચવ્યો');
  }
  document.addEventListener('keydown',function(ev){
    var t=ev.target;if(!t||!t.classList||!t.classList.contains('rate'))return;
    if(ev.key==='Enter'){ev.preventDefault();savePrice(+t.dataset.rate)}
    else if(ev.key==='Escape'){priceEdit=null;renderPrices()}
  });

  /* ---------- Theme and toast ---------- */
  function applyTheme(m){
    var r=document.documentElement;
    if(m==='light'||m==='dark')r.setAttribute('data-theme',m);else r.removeAttribute('data-theme');
    save(THEME,m);
  }
  function currentDark(){
    var t=document.documentElement.getAttribute('data-theme');
    if(t)return t==='dark';
    return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  }
  var tt;
  function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2000)}

  document.addEventListener('click',function(ev){
    var el=ev.target.closest('button');if(!el)return;
    if(el.dataset.open==='customer'){adminView='customer';cuMode='add';cuDelId=null;resetCust();return showView()}
    if(el.id==='custBack'){adminView='menu';return showView()}
    if(el.id==='cuCancel'){cuDelId=null;return resetCust()}
    if(el.dataset.cmode){cuMode=el.dataset.cmode;cuDelId=null;return resetCust()}
    if(el.dataset.crow){
      var cid=+el.dataset.crow,cc=customers.filter(function(x){return x.id===cid})[0];if(!cc)return;
      if(cuMode==='edit'){cuEditId=cid;$('#cu-en').value=cc.en;$('#cu-mob').value=cc.mobile;$('#cu-email').value=cc.email||'';$('#cu-addr').value=cc.address||'';$('#cu-city').value=cc.city||'';renderCust();$('#cu-en').focus()}
      else if(cuMode==='delete'){cuDelId=cid;renderCust()}
      return;
    }
    if(el.id==='cuNo'){cuDelId=null;return renderCust()}
    if(el.id==='cuYes'){customers=customers.filter(function(x){return x.id!==cuDelId});save(CUST_KEY,customers);sheetSend({action:'deleteCustomer',id:cuDelId});cuDelId=null;toast('Customer deleted · ગ્રાહક કાઢ્યો');return renderCust()}
    if(el.dataset.open==='supplier'){adminView='supplier';suMode='add';suDelId=null;resetSupp();return showView()}
    if(el.id==='suppBack'){adminView='menu';return showView()}
    if(el.id==='suCancel'){suDelId=null;return resetSupp()}
    if(el.dataset.smode){suMode=el.dataset.smode;suDelId=null;return resetSupp()}
    if(el.dataset.srow){
      var sid=+el.dataset.srow,sc=suppliers.filter(function(x){return x.id===sid})[0];if(!sc)return;
      if(suMode==='edit'){suEditId=sid;$('#su-en').value=sc.en;$('#su-mob').value=sc.mobile;$('#su-email').value=sc.email||'';$('#su-addr').value=sc.address||'';$('#su-city').value=sc.city||'';renderSupp();$('#su-en').focus()}
      else if(suMode==='delete'){suDelId=sid;renderSupp()}
      return;
    }
    if(el.id==='suNo'){suDelId=null;return renderSupp()}
    if(el.id==='suYes'){suppliers=suppliers.filter(function(x){return x.id!==suDelId});save(SUPP_KEY,suppliers);sheetSend({action:'deleteSupplier',id:suDelId});suDelId=null;toast('Supplier deleted · સપ્લાયર કાઢ્યો');return renderSupp()}
    if(el.dataset.mic)return micClick(el.dataset.mic);
    if(el.dataset.act==='perm')return openPerms();
    if(el.dataset.t)return setTab(el.dataset.t);
    if(el.id==='themeBtn'){applyTheme(currentDark()?'light':'dark');return toast(currentDark()?'Dark theme · ડાર્ક થીમ':'Light theme · લાઇટ થીમ')}
    if(el.dataset.open==='items'){adminView='items';mode='add';editId=null;delId=null;resetForm();renderItems();return showView()}
    if(el.dataset.add)return toast(el.dataset.add+' · '+el.dataset.gu+' — Under construction · નિર્માણાધીન');
    if(el.dataset.open==='prices'){adminView='prices';priceEdit=null;renderPrices();return showView()}
    if(el.id==='pricesBack'){adminView='menu';priceEdit=null;return showView()}
    if(el.dataset.edit){
      var pid=+el.dataset.edit;
      if(priceEdit===pid)return savePrice(pid);
      priceEdit=pid;renderPrices();
      var inp=$('#rate-'+pid);if(inp){inp.focus();inp.select()}
      return;
    }
    if(el.id==='itemsBack'){adminView='menu';return showView()}
    if(el.dataset.mode)return setMode(el.dataset.mode);
    if(el.id==='cancelBtn'){resetForm();delId=null;renderItems();return}
    if(el.dataset.row){
      var id=+el.dataset.row,it=items.filter(function(x){return x.id===id})[0];if(!it)return;
      if(mode==='edit'){editId=id;$('#item-en').value=it.en;$('#item-unit').value=it.unit;renderItems();$('#item-en').focus()}
      else if(mode==='delete'){delId=id;renderItems()}
      return;
    }
    if(el.id==='confirmNo'){delId=null;return renderItems()}
    if(el.id==='confirmYes'){delete prices[delId];save(PRICES_KEY,prices);items=items.filter(function(x){return x.id!==delId});sheetSend({action:'deleteItem',id:delId});delId=null;persist();toast('Item deleted · વસ્તુ કાઢી');return renderItems()}
  });

  applyTheme(load(THEME,'system'));
  renderItems();
  sheetLoadItems();
  var h=(location.hash||'').slice(1);
  tab=TITLES[h]?h:'home';
  showView();
})();
</script>

</body></html>
